<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Learning Story</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  :root{
    --bg: #FBF7F0;
    --card: #FFFFFF;
    --ink: #2E2A25;
    --ink-soft: #6B6459;
    --sage: #6E8A6F;
    --sage-dark: #52694F;
    --kowhai: #E8B94B;
    --line: #E7E0D3;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 20px 16px 60px; max-width: 560px; margin: 0 auto; }

  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .brand-mark {
    font-family: 'Baloo 2', sans-serif;
    font-size: 28px; font-weight: 700; color: var(--sage-dark);
  }
  .brand-sub {
    font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase;
    color: var(--ink-soft);
  }
  p.tagline { margin: 0 0 22px; color: var(--ink-soft); font-size: 14px; }

  .field { margin-bottom: 18px; }
  label {
    display: block; font-size: 12.5px; font-weight: 600;
    letter-spacing: .02em; text-transform: uppercase;
    color: var(--sage-dark); margin-bottom: 6px;
  }
  .optional-tag, .required-tag {
    text-transform: none; letter-spacing: 0; font-weight: 500;
    font-size: 11px; padding: 1px 7px; border-radius: 10px; margin-left: 2px;
  }
  .optional-tag { background: #EFEBE0; color: var(--ink-soft); }
  .required-tag { background: #F3E3D9; color: #A05A2C; }
  input[type="text"], textarea {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; font-size: 16px; font-family: inherit;
    background: var(--card); color: var(--ink);
  }
  input[type="text"]:focus, textarea:focus {
    outline: none; border-color: var(--sage);
    box-shadow: 0 0 0 3px rgba(110,138,111,0.15);
  }
  textarea { min-height: 100px; resize: vertical; line-height: 1.45; }
  .hint { font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; }

  input[type="date"] {
    width: 100%; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 13px; font-size: 16px; font-family: inherit;
    background: var(--card); color: var(--ink);
  }

  .photo-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-bottom: 8px;
  }
  .photo-grid:empty { margin-bottom: 0; }
  .photo-thumb {
    position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    background: #F1EDE3; border: 1px solid var(--line);
  }
  .photo-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-thumb .remove-thumb {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
    background: rgba(46,42,37,0.75); color: #fff; border: none; border-radius: 50%;
    font-size: 14px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .photo-add-row { display: flex; gap: 8px; }
  .add-photo-btn {
    flex: 1;
    border: none; border-radius: var(--radius);
    background: var(--sage-dark); text-align: center; padding: 14px 10px;
    position: relative; color: #fff; font-size: 13.5px; font-weight: 700;
  }
  .add-photo-btn:active { background: #445a42; }
  .add-photo-btn input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .generate-btn {
    width: 100%; padding: 15px; margin-top: 8px;
    background: var(--sage-dark); color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .generate-btn:active { background: #445a42; }
  .generate-btn:disabled { background: #B9C4B6; cursor: not-allowed; }

  .status { text-align: center; font-size: 13.5px; color: var(--ink-soft); margin-top: 10px; min-height: 18px; }

  .browse-toggle {
    width: 100%; background: var(--card); border: 1px solid var(--line);
    color: var(--sage-dark); font-size: 13.5px; font-weight: 700;
    padding: 12px; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .browse-toggle.active { background: var(--sage-dark); color: #fff; border-color: var(--sage-dark); }
  .goal-strand-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-weight: 700; font-size: 13px;
    margin-top: 8px;
  }
  .goal-strand-goals { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .goal-results { margin-top: 8px; display: flex; flex-direction: column; }
  .goal-result {
    text-align: left; width: 100%; background: var(--card); cursor: pointer;
    border-left-width: 4px; border-left-style: solid; border-top: 1px solid var(--line);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    border-radius: 0 8px 8px 0; padding: 8px 10px; font-family: inherit;
  }
  .goal-result:active { background: #F1EDE3; }
  .goal-result.selected { opacity: 0.45; }
  .goal-result-title { font-size: 12px; font-weight: 700; margin: 0 0 3px; }
  .goal-result-text { font-size: 12.5px; color: var(--ink); margin: 0 0 3px; line-height: 1.4; }
  .goal-result-outcome { font-size: 11.5px; color: var(--ink-soft); margin: 0; line-height: 1.4; }

  .goal-chips { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .goal-chip {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    border-left-width: 4px; border-left-style: solid;
    border-top: 1px solid rgba(0,0,0,0.06); border-right: 1px solid rgba(0,0,0,0.06); border-bottom: 1px solid rgba(0,0,0,0.06);
    font-size: 12.5px; font-weight: 700; padding: 8px 10px; border-radius: 0 8px 8px 0;
    cursor: pointer; font-family: inherit;
  }
  .goal-chip .x { font-size: 15px; line-height: 1; flex-shrink: 0; }
  .goal-empty-hint { font-size: 12.5px; color: var(--ink-soft); padding: 6px 2px; }

  #preview-page { display: none; }
</style>
</head>
<body>

  <div class="brand">
    <span class="brand-mark">Kōrero</span>
    <span class="brand-sub">Learning Story</span>
  </div>
  <p class="tagline">Fill this in on the floor, finish it on the computer.</p>

  <div class="field">
    <label>Photos <span class="optional-tag">optional</span></label>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="photo-add-row">
      <div class="add-photo-btn">
        <input type="file" id="camera-input" accept="image/*" capture="environment">
        <span>📷 Take photo</span>
      </div>
      <div class="add-photo-btn">
        <input type="file" id="photo-input" accept="image/*" multiple>
        <span>🖼️ Choose photos</span>
      </div>
    </div>
  </div>

  <div class="field">
    <label for="notice">What did I observe? <span class="optional-tag">optional</span></label>
    <textarea id="notice" placeholder="Tap here, then use the mic on your keyboard to talk it out"></textarea>
    <div class="hint">Tip: tap the field, then tap the microphone icon on your keyboard to dictate.</div>
  </div>

  <div class="field">
    <label for="learning">What learning did I notice? <span class="optional-tag">optional</span></label>
    <textarea id="learning" placeholder="What skills, ideas or dispositions were being developed?"></textarea>
  </div>

  <div class="field">
    <label for="extend">How could we extend this next time? <span class="optional-tag">optional</span></label>
    <textarea id="extend" placeholder="Ideas for next steps"></textarea>
  </div>

  <div class="field">
    <label>Whāriki goals <span class="optional-tag">optional</span></label>
    <button type="button" class="browse-toggle" id="browse-toggle">Browse all goals</button>
    <div class="goal-results" id="goal-results"></div>
    <div class="goal-chips" id="goal-chips"></div>
  </div>

  <div class="field">
    <label for="title">Title <span class="required-tag">required</span></label>
    <input type="text" id="title" placeholder="e.g. Building the tallest tower">
  </div>

  <div class="field">
    <label for="observer">Observed by <span class="required-tag">required</span></label>
    <input type="text" id="observer" placeholder="Your name">
  </div>

  <div class="field">
    <label for="date-input">Date</label>
    <input type="date" id="date-input">
    <div class="hint" id="date-preview"></div>
  </div>

  <div class="field">
    <label for="children-names">Children's names <span class="optional-tag">optional</span></label>
    <input type="text" id="children-names" placeholder="e.g. Aroha, Tama">
  </div>

  <button class="generate-btn" id="generate-btn">Create Word Document</button>
  <div class="status" id="status"></div>

  <div id="preview-page"></div>


<script>
  const dateInput = document.getElementById('date-input');
  const datePreview = document.getElementById('date-preview');
  const today = new Date();
  // format as YYYY-MM-DD in LOCAL time (not UTC) for the date input's default value
  const todayLocal = new Date(today.getTime() - today.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  dateInput.value = todayLocal;

  function formatDisplayDate(dateInputValue) {
    // parse as local date (avoids the UTC off-by-one-day issue with new Date('YYYY-MM-DD'))
    const [y, m, d] = dateInputValue.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return dt.toLocaleDateString('en-NZ', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function updateDatePreview() {
    datePreview.textContent = dateInput.value ? formatDisplayDate(dateInput.value) : '';
  }
  updateDatePreview();
  dateInput.addEventListener('input', updateDatePreview);

  const photoInput = document.getElementById('photo-input');
  const photoGrid = document.getElementById('photo-grid');
  let photos = []; // array of orientation-corrected dataURLs

  function normalizeImageOrientation(dataUrl) {
    // Draws the photo onto a canvas, which bakes in the browser's already-correct
    // rotation as real pixels — this removes the EXIF orientation *tag* that
    // Word/Google Docs' image renderer often ignores, causing sideways photos.
    // Also downscales + re-compresses as JPEG: exporting full camera resolution as
    // lossless PNG produced huge files (20-40MB+), which is a likely cause of the
    // flicker/lag seen in the Google Docs Android app when rendering the doc.
    const MAX_DIM = 1400; // px, plenty for a photo displayed a few inches wide
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(MAX_DIM / img.naturalWidth, MAX_DIM / img.naturalHeight, 1);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function renderPhotoGrid() {
    photoGrid.innerHTML = '';
    photos.forEach((dataUrl, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      thumb.innerHTML = `<img src="${dataUrl}"><button type="button" class="remove-thumb">×</button>`;
      thumb.querySelector('.remove-thumb').addEventListener('click', () => {
        photos.splice(i, 1);
        renderPhotoGrid();
      });
      photoGrid.appendChild(thumb);
    });
  }

  function handlePhotoFiles(inputEl) {
    const files = Array.from(inputEl.files || []);
    let remaining = files.length;
    if (!remaining) return;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const normalized = await normalizeImageOrientation(evt.target.result);
        photos.push(normalized);
        remaining--;
        if (remaining === 0) {
          renderPhotoGrid();
          inputEl.value = '';
        }
      };
      reader.readAsDataURL(file);
    });
  }

  photoInput.addEventListener('change', () => handlePhotoFiles(photoInput));
  document.getElementById('camera-input').addEventListener('change', () => handlePhotoFiles(document.getElementById('camera-input')));

  const WHARIKI_GOALS = [
    { id: 'wb1', strand: 'Wellbeing', maori: 'Mana Atua', goal: 1, colorFill: 'FCEBEB', colorBorder: 'E24B4A', colorText: 'A32D2D',
      text: 'Children experience an environment where their health is promoted.',
      outcome: 'Increasingly capable of keeping themselves healthy and caring for themselves | te oranga nui' },
    { id: 'wb2', strand: 'Wellbeing', maori: 'Mana Atua', goal: 2, colorFill: 'FCEBEB', colorBorder: 'E24B4A', colorText: 'A32D2D',
      text: 'Children experience an environment where their emotional wellbeing is nurtured.',
      outcome: 'Increasingly capable of managing themselves and expressing their feelings and needs | te whakahua whakaaro' },
    { id: 'wb3', strand: 'Wellbeing', maori: 'Mana Atua', goal: 3, colorFill: 'FCEBEB', colorBorder: 'E24B4A', colorText: 'A32D2D',
      text: 'Children experience an environment where they are kept safe from harm.',
      outcome: 'Increasingly capable of keeping themselves and others safe from harm | te noho haumaru' },

    { id: 'bl1', strand: 'Belonging', maori: 'Mana Whenua', goal: 1, colorFill: 'FAECE7', colorBorder: 'D85A30', colorText: '993C1D',
      text: 'Children and their families experience an environment where connecting links with the family and the wider world are affirmed and extended.',
      outcome: 'Increasingly capable of making connections between people, places and things in their world | te waihanga hononga' },
    { id: 'bl2', strand: 'Belonging', maori: 'Mana Whenua', goal: 2, colorFill: 'FAECE7', colorBorder: 'D85A30', colorText: '993C1D',
      text: 'Children and their families experience an environment where they know that they have a place.',
      outcome: 'Increasingly capable of taking part in caring for this place | te manaaki i te taiao' },
    { id: 'bl3', strand: 'Belonging', maori: 'Mana Whenua', goal: 3, colorFill: 'FAECE7', colorBorder: 'D85A30', colorText: '993C1D',
      text: 'Children and their families experience an environment where they feel comfortable with the routines, customs and regular events.',
      outcome: 'Increasingly capable of understanding how things work here and adapting to change | te mārama ki te āhua o ngā whakahaere me te mōhio ki te panoni' },
    { id: 'bl4', strand: 'Belonging', maori: 'Mana Whenua', goal: 4, colorFill: 'FAECE7', colorBorder: 'D85A30', colorText: '993C1D',
      text: 'Children and their families experience an environment where they know the limits and boundaries of acceptable behaviour.',
      outcome: 'Increasingly capable of showing respect for kaupapa, rules and the rights of others | te mahi whakaute' },

    { id: 'co1', strand: 'Contribution', maori: 'Mana Tangata', goal: 1, colorFill: 'FAEEDA', colorBorder: 'EF9F27', colorText: '854F0B',
      text: 'Children experience an environment where there are equitable opportunities for learning, irrespective of gender, ability, age, ethnicity or background.',
      outcome: 'Increasingly capable of treating others fairly and including them in play | te ngākau makuru' },
    { id: 'co2', strand: 'Contribution', maori: 'Mana Tangata', goal: 2, colorFill: 'FAEEDA', colorBorder: 'EF9F27', colorText: '854F0B',
      text: 'Children experience an environment where they are affirmed as individuals.',
      outcome: 'Increasingly capable of recognising and appreciating their own ability to learn | te rangatiratanga' },
    { id: 'co3', strand: 'Contribution', maori: 'Mana Tangata', goal: 3, colorFill: 'FAEEDA', colorBorder: 'EF9F27', colorText: '854F0B',
      text: 'Children experience an environment where they are encouraged to learn with and alongside others.',
      outcome: 'Increasingly capable of using a range of strategies and skills to play and learn with others | te ngākau aroha' },

    { id: 'cm1', strand: 'Communication', maori: 'Mana Reo', goal: 1, colorFill: 'EAF3DE', colorBorder: '639922', colorText: '3B6D11',
      text: 'Children experience an environment where they develop non-verbal communication skills for a range of purposes.',
      outcome: 'Increasingly capable of using gesture and movement to express themselves | he kōrero ā-tinana' },
    { id: 'cm2', strand: 'Communication', maori: 'Mana Reo', goal: 2, colorFill: 'EAF3DE', colorBorder: '639922', colorText: '3B6D11',
      text: 'Children experience an environment where they develop verbal communication skills for a range of purposes.',
      outcome: 'Increasingly capable of understanding oral language and using it for a range of purposes | he kōrero ā-waha' },
    { id: 'cm3', strand: 'Communication', maori: 'Mana Reo', goal: 3, colorFill: 'EAF3DE', colorBorder: '639922', colorText: '3B6D11',
      text: 'Children experience an environment where they experience the stories and symbols of their own and other cultures.',
      outcome: 'Increasingly capable of enjoying stories, recognising print symbols, or recognising mathematical symbols and concepts | he kōrero paki / he kōrero tuhituhi / he kōrero pāngarau' },
    { id: 'cm4', strand: 'Communication', maori: 'Mana Reo', goal: 4, colorFill: 'EAF3DE', colorBorder: '639922', colorText: '3B6D11',
      text: 'Children experience an environment where they discover different ways to be creative and expressive.',
      outcome: 'Increasingly capable of expressing their feelings and ideas using a wide range of materials and modes | he kōrero auaha' },

    { id: 'ex1', strand: 'Exploration', maori: 'Mana Aotūroa', goal: 1, colorFill: 'E6F1FB', colorBorder: '378ADD', colorText: '185FA5',
      text: 'Children experience an environment where their play is valued as meaningful learning and the importance of spontaneous play is recognised.',
      outcome: 'Increasingly capable of playing, imagining, inventing and experimenting | te whakaaro me te tūhurahura i te pūtaiao' },
    { id: 'ex2', strand: 'Exploration', maori: 'Mana Aotūroa', goal: 2, colorFill: 'E6F1FB', colorBorder: '378ADD', colorText: '185FA5',
      text: 'Children experience an environment where they gain confidence in and control of their bodies.',
      outcome: 'Increasingly capable of moving confidently and challenging themselves physically | te wero ā-tinana' },
    { id: 'ex3', strand: 'Exploration', maori: 'Mana Aotūroa', goal: 3, colorFill: 'E6F1FB', colorBorder: '378ADD', colorText: '185FA5',
      text: 'Children experience an environment where they learn strategies for active exploration, thinking and reasoning.',
      outcome: 'Increasingly capable of using a range of strategies for reasoning and problem solving | te hīraurau hopanga' },
    { id: 'ex4', strand: 'Exploration', maori: 'Mana Aotūroa', goal: 4, colorFill: 'E6F1FB', colorBorder: '378ADD', colorText: '185FA5',
      text: 'Children experience an environment where they develop working theories for making sense of the natural, social, physical and material worlds.',
      outcome: 'Increasingly capable of making sense of their worlds by generating and refining working theories | te rangahau me te mātauranga' }
  ];

  const selectedGoalIds = [];
  const goalResultsEl = document.getElementById('goal-results');
  const goalChipsEl = document.getElementById('goal-chips');
  const browseToggle = document.getElementById('browse-toggle');
  let browseOpen = false;
  const expandedStrands = new Set();

  function makeGoalResultEl(g) {
    const div = document.createElement('div');
    const isSelected = selectedGoalIds.includes(g.id);
    div.className = 'goal-result' + (isSelected ? ' selected' : '');
    div.style.borderLeftColor = '#' + g.colorBorder;
    div.innerHTML = `
      <p class="goal-result-title" style="color:#${g.colorText}">${g.strand} · Goal ${g.goal}</p>
      <p class="goal-result-text">${g.text}</p>
      <p class="goal-result-outcome">${g.outcome}</p>
    `;
    div.addEventListener('click', () => {
      if (!selectedGoalIds.includes(g.id)) {
        selectedGoalIds.push(g.id);
        renderGoalChips();
        renderGoalResults();
      }
    });
    return div;
  }

  function renderGoalResults() {
    goalResultsEl.innerHTML = '';
    if (!browseOpen) return;

    const strands = [...new Set(WHARIKI_GOALS.map(g => g.strand))];
    strands.forEach(strand => {
      const strandGoals = WHARIKI_GOALS.filter(g => g.strand === strand);
      const header = document.createElement('div');
      header.className = 'goal-strand-header';
      header.style.borderLeftColor = '#' + strandGoals[0].colorBorder;
      header.style.borderLeftWidth = '4px';
      header.style.borderLeftStyle = 'solid';
      const isOpen = expandedStrands.has(strand);
      header.innerHTML = `<span>${strand}</span><span>${isOpen ? '−' : '+'}</span>`;
      header.addEventListener('click', () => {
        if (expandedStrands.has(strand)) expandedStrands.delete(strand);
        else expandedStrands.add(strand);
        renderGoalResults();
      });
      goalResultsEl.appendChild(header);
      if (isOpen) {
        const wrap = document.createElement('div');
        wrap.className = 'goal-strand-goals';
        strandGoals.forEach(g => wrap.appendChild(makeGoalResultEl(g)));
        goalResultsEl.appendChild(wrap);
      }
    });
  }

  browseToggle.addEventListener('click', () => {
    browseOpen = !browseOpen;
    browseToggle.classList.toggle('active', browseOpen);
    browseToggle.textContent = browseOpen ? 'Close' : 'Browse all goals';
    if (!browseOpen) expandedStrands.clear();
    renderGoalResults();
  });

  function renderGoalChips() {
    goalChipsEl.innerHTML = '';
    selectedGoalIds.forEach(id => {
      const g = WHARIKI_GOALS.find(x => x.id === id);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'goal-chip';
      chip.style.borderLeftColor = '#' + g.colorBorder;
      chip.style.background = '#' + g.colorFill;
      chip.style.color = '#' + g.colorText;
      chip.innerHTML = `<span>${g.strand} · Goal ${g.goal}</span><span class="x">×</span>`;
      chip.addEventListener('click', () => {
        const idx = selectedGoalIds.indexOf(id);
        if (idx > -1) selectedGoalIds.splice(idx, 1);
        renderGoalChips();
        renderGoalResults();
      });
      goalChipsEl.appendChild(chip);
    });
  }

  function loadImageDims(dataUrl) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
      img.src = dataUrl;
    });
  }

  async function dataUrlToBytes(dataUrl) {
    const res = await fetch(dataUrl);
    const buf = await res.arrayBuffer();
    return new Uint8Array(buf);
  }

  function wrapCanvasText(ctx, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    return lines;
  }

  async function renderGoalStickerImage(g) {
    await document.fonts.ready;
    const SCALE = 2; // render at 2x for crisp text when printed
    const WIDTH = 340;
    const PAD = 14;
    const textMaxWidth = WIDTH - PAD * 2;

    // measure first at 1x to compute required height
    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');

    mctx.font = '700 13px "Nunito Sans"';
    const titleText = `${g.strand} · Goal ${g.goal} — ${g.text}`;
    const titleLines = wrapCanvasText(mctx, titleText, textMaxWidth);

    mctx.font = 'italic 400 11.5px "Nunito Sans"';
    const outcomeLines = wrapCanvasText(mctx, 'Outcome: ' + g.outcome, textMaxWidth);

    const titleLineHeight = 17;
    const outcomeLineHeight = 15;
    const gapBetween = 5;
    const height = PAD * 2 + titleLines.length * titleLineHeight + gapBetween + outcomeLines.length * outcomeLineHeight;

    const canvas = document.createElement('canvas');
    canvas.width = WIDTH * SCALE;
    canvas.height = height * SCALE;
    const ctx = canvas.getContext('2d');
    ctx.scale(SCALE, SCALE);

    // background
    const radius = 8;
    ctx.fillStyle = '#' + g.colorFill;
    ctx.beginPath();
    ctx.moveTo(radius, 0);
    ctx.arcTo(WIDTH, 0, WIDTH, height, radius);
    ctx.arcTo(WIDTH, height, 0, height, radius);
    ctx.arcTo(0, height, 0, 0, radius);
    ctx.arcTo(0, 0, WIDTH, 0, radius);
    ctx.closePath();
    ctx.fill();

    // border
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#' + g.colorBorder;
    ctx.stroke();

    // left accent bar
    ctx.fillStyle = '#' + g.colorBorder;
    ctx.fillRect(0, 0, 4, height);

    // title (strand/goal + description on the same line, wrapped)
    ctx.fillStyle = '#' + g.colorText;
    ctx.font = '700 13px "Nunito Sans"';
    ctx.textBaseline = 'top';
    titleLines.forEach((line, i) => ctx.fillText(line, PAD, PAD + i * titleLineHeight));

    // outcome
    ctx.fillStyle = '#6B6459';
    ctx.font = 'italic 400 11.5px "Nunito Sans"';
    const outcomeStartY = PAD + titleLines.length * titleLineHeight + gapBetween;
    outcomeLines.forEach((line, i) => ctx.fillText(line, PAD, outcomeStartY + i * outcomeLineHeight));

    return { dataUrl: canvas.toDataURL('image/png'), width: WIDTH, height };
  }

  function guessImageType(dataUrl) {
    const match = /^data:image\/(png|jpe?g|gif|bmp)/i.exec(dataUrl);
    if (!match) return 'png';
    const ext = match[1].toLowerCase();
    return ext === 'jpg' ? 'jpeg' : ext;
  }

  async function buildDocxBlob() {
    const {
      Document, Packer, Paragraph, TextRun, ImageRun,
      HorizontalPositionRelativeFrom, VerticalPositionRelativeFrom, TextWrappingType
    } = window.docx;

    const pxToEmu = 9525;
    const CONTENT_WIDTH_TWIPS = 11906 - 720 * 2;
    const contentWidthPx = Math.round(CONTENT_WIDTH_TWIPS / 1440 * 96);

    // Builds a paragraph of side-by-side floating images (fixed pixel widths, given
    // per-image) using "break text" (top/bottom) wrap — text stops above and resumes
    // below rather than hugging the sides. Since each item is a flat image, Word/Docs
    // pushes a whole one to the next page rather than splitting it mid-content.
    function buildFloatingImageRow(items, gapPx) {
      let cumulativeOffsetEmu = 0;
      const runs = items.map(({ bytes, type, w, h }) => {
        const run = new ImageRun({
          data: bytes,
          type,
          transformation: { width: w, height: h },
          floating: {
            horizontalPosition: { relative: HorizontalPositionRelativeFrom.COLUMN, offset: cumulativeOffsetEmu },
            verticalPosition: { relative: VerticalPositionRelativeFrom.PARAGRAPH, offset: 0 },
            wrap: { type: TextWrappingType.TOP_AND_BOTTOM },
            margins: { top: 45000, bottom: 90000, left: 30000, right: 30000 }
          }
        });
        cumulativeOffsetEmu += w * pxToEmu + gapPx * pxToEmu;
        return run;
      });
      return new Paragraph({ children: runs, spacing: { after: 100 } });
    }

    function chunk(arr, size) {
      const out = [];
      for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
      return out;
    }

    const title = document.getElementById('title').value.trim() || 'Learning Story';
    const observer = document.getElementById('observer').value.trim();
    const dateStr = formatDisplayDate(dateInput.value);
    const childrenNames = document.getElementById('children-names').value.trim();
    const notice = document.getElementById('notice').value.trim();
    const learning = document.getElementById('learning').value.trim();
    const extend = document.getElementById('extend').value.trim();

    const HEADING_GREY = '5A554E';

    const children = [
      new Paragraph({
        children: [new TextRun({ text: title, font: 'Baloo 2', bold: true, size: 60, color: '2E2A25' })],
        spacing: { after: 80 }
      }),
      new Paragraph({
        children: [new TextRun({
          text: [observer ? `Observed by ${observer}` : '', dateStr, childrenNames ? `With: ${childrenNames}` : '']
            .filter(Boolean).join('   •   '),
          font: 'Nunito Sans',
          italics: true,
          size: 23,
          color: '6B6459'
        })],
        spacing: { after: 200 }
      })
    ];

    // --- photos, floating side-by-side in rows with "break text" (top/bottom) wrap ---
    if (photos.length) {
      const gapPx = 14;
      const rows = chunk(photos, 3);
      for (const row of rows) {
        const rowMaxWidthPx = (contentWidthPx - gapPx * (row.length - 1)) / row.length;
        const items = [];
        for (const dataUrl of row) {
          const dims = await loadImageDims(dataUrl);
          const scale = Math.min(rowMaxWidthPx / dims.width, 260 / dims.height, 1);
          const w = Math.round(dims.width * scale);
          const h = Math.round(dims.height * scale);
          const bytes = await dataUrlToBytes(dataUrl);
          items.push({ bytes, type: guessImageType(dataUrl), w, h });
        }
        children.push(buildFloatingImageRow(items, gapPx));
      }
    }

    function pushLabelledText(label, text) {
      children.push(new Paragraph({
        children: [new TextRun({ text: label, font: 'Baloo 2', bold: true, size: 24, color: HEADING_GREY })],
        spacing: { before: 160, after: 60 }
      }));
      if (!text) return;
      text.split(/\n/).forEach(line => {
        children.push(new Paragraph({
          children: [new TextRun({ text: line, font: 'Nunito Sans', size: 27 })],
          spacing: { after: 100 }
        }));
      });
    }

    pushLabelledText('What did I observe?', notice);
    pushLabelledText('What learning did I notice?', learning);
    pushLabelledText('How could we extend this next time?', extend);

    // --- Whāriki goals, as packed sticker images (2 per row) ---
    // rendered as flat images (not live Word text/tables) so they: (a) can sit
    // narrow and tight without fighting Word's table-width quirks, (b) never split
    // mid-box across a page break, and (c) waste minimal vertical space.
    if (selectedGoalIds.length) {
      const goals = selectedGoalIds.map(id => WHARIKI_GOALS.find(x => x.id === id));
      const gapPx = 12;
      const rows = chunk(goals, 2);
      for (const row of rows) {
        const items = [];
        for (const g of row) {
          const { dataUrl, width, height } = await renderGoalStickerImage(g);
          const bytes = await dataUrlToBytes(dataUrl);
          items.push({ bytes, type: 'png', w: width, h: height });
        }
        children.push(buildFloatingImageRow(items, gapPx));
      }
    } else {
      children.push(new Paragraph({
        children: [new TextRun({ text: 'Whāriki goals', font: 'Baloo 2', bold: true, size: 26, color: HEADING_GREY })],
        spacing: { before: 200, after: 120 }
      }));
    }

    const doc = new Document({
      sections: [{
        properties: {
          page: {
            size: { width: 11906, height: 16838 },
            margin: { top: 720, bottom: 720, left: 720, right: 720 }
          }
        },
        children
      }]
    });

    return Packer.toBlob(doc);
  }

  document.getElementById('generate-btn').addEventListener('click', async () => {
    const btn = document.getElementById('generate-btn');
    const status = document.getElementById('status');
    const title = document.getElementById('title').value.trim() || 'Learning Story';

    btn.disabled = true;
    btn.textContent = 'Building document…';
    status.textContent = '';

    try {
      const blob = await buildDocxBlob();

      const observer = document.getElementById('observer').value.trim();
      const [fy, fm, fd] = dateInput.value.split('-').map(Number);
      const dateForFilename = new Date(fy, fm - 1, fd).toLocaleDateString('en-NZ', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, ' ');
      const safeTitle = title.replace(/[\\/:*?"<>|]/g, '');
      const filename = `${safeTitle}${observer ? ' - ' + observer : ''} - ${dateForFilename}.docx`;

      // Try native share sheet first (best on iPhone)
      const file = new File([blob], filename, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: title });
          status.textContent = 'Shared! Save it to Drive or Files.';
          selectedGoalIds.length = 0;
          renderGoalChips();
          photos = [];
          renderPhotoGrid();
          btn.disabled = false;
          btn.textContent = 'Create Word Document';
          return;
        } catch (shareErr) {
          // user cancelled share sheet or it failed — fall through to download
        }
      }

      // Fallback: plain download
      saveAs(blob, filename);
      status.textContent = 'Downloaded. Look for it in Files, or share it from there.';
      selectedGoalIds.length = 0;
      renderGoalChips();
      photos = [];
      renderPhotoGrid();
    } catch (err) {
      status.textContent = 'Something went wrong generating the document.';
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create Word Document';
    }
  });
</script>
