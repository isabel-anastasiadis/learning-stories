<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Sheets Sync — Test Page v2</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 520px; margin: 20px auto; padding: 0 16px; line-height: 1.5;
    color: #2E2A25; background: #FBF7F0;
  }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; margin-top: 28px; border-top: 1px solid #E7E0D3; padding-top: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 10px; font-size: 14px;
    border: 1px solid #E7E0D3; border-radius: 8px; font-family: inherit;
  }
  button {
    margin-top: 10px; padding: 10px 16px; font-size: 14px; font-weight: 700;
    border: 1.5px solid #52694F; background: #fff; color: #52694F;
    border-radius: 8px; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: #52694F; color: #fff; }
  #log {
    margin-top: 20px; background: #fff; border: 1px solid #E7E0D3; border-radius: 8px;
    padding: 12px; font-family: 'SF Mono', Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word; max-height: 340px; overflow-y: auto;
  }
  .status { font-size: 13px; color: #6B6459; margin-top: 6px; }
  .picked-file {
    margin-top: 10px; background: #E9EFE6; border-radius: 8px; padding: 10px 12px;
    font-size: 13px; color: #52694F; font-weight: 600;
  }
</style>
</head>
<body>

<h1>🧪 Google Sheets Sync — Test Page v2</h1>
<p class="status">Now using <code>drive.file</code> scope + the Google Picker — access is limited to only the one file you explicitly select, not your whole Drive.</p>

<h2>1. Setup</h2>
<label for="client-id">Google OAuth Client ID</label>
<input type="text" id="client-id" placeholder="xxxxxxxxxx.apps.googleusercontent.com">

<label for="api-key">Google API Key (for the Picker)</label>
<input type="text" id="api-key" placeholder="AIza...">

<button id="save-config-btn">Save these (this device only)</button>
<div class="status" id="config-status"></div>

<h2>2. Sign in</h2>
<button id="signin-btn" class="primary" disabled>Sign in with Google</button>
<div class="status" id="auth-status">Not signed in.</div>

<h2>3. Choose your settings sheet</h2>
<button id="choose-file-btn" disabled>Choose file</button>
<div class="picked-file" id="picked-file" style="display: none;"></div>

<h2>4. Try reading/writing cell A1</h2>
<button id="read-btn" disabled>Read A1</button>
<br>
<label for="write-value">Value to write to A1</label>
<input type="text" id="write-value" placeholder="e.g. hello from the test page">
<button id="write-btn" disabled>Write to A1</button>

<h2>Log</h2>
<div id="log">(nothing yet)</div>

<script>
  const clientIdInput = document.getElementById('client-id');
  const apiKeyInput = document.getElementById('api-key');
  const signinBtn = document.getElementById('signin-btn');
  const chooseFileBtn = document.getElementById('choose-file-btn');
  const pickedFileEl = document.getElementById('picked-file');
  const readBtn = document.getElementById('read-btn');
  const writeBtn = document.getElementById('write-btn');
  const writeValueInput = document.getElementById('write-value');
  const authStatus = document.getElementById('auth-status');
  const configStatus = document.getElementById('config-status');
  const logEl = document.getElementById('log');

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logEl.textContent = `[${time}] ${msg}\n\n` + logEl.textContent;
  }

  clientIdInput.value = localStorage.getItem('test_client_id') || '';
  apiKeyInput.value = localStorage.getItem('test_api_key') || '';
  if (clientIdInput.value) signinBtn.disabled = false;

  document.getElementById('save-config-btn').addEventListener('click', () => {
    localStorage.setItem('test_client_id', clientIdInput.value.trim());
    localStorage.setItem('test_api_key', apiKeyInput.value.trim());
    configStatus.textContent = 'Saved. You can now try signing in.';
    signinBtn.disabled = !clientIdInput.value.trim();
    log('Config saved.');
  });

  let accessToken = null;
  let tokenClient = null;
  let pickerLoaded = false;
  let selectedSheetId = null;

  window.addEventListener('load', () => {
    if (window.gapi) {
      gapi.load('picker', () => {
        pickerLoaded = true;
        log('Picker library loaded.');
      });
    }
  });

  function ensureTokenClient() {
    if (tokenClient) return tokenClient;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientIdInput.value.trim(),
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: (resp) => {
        if (resp.error) {
          log('Sign-in error: ' + JSON.stringify(resp));
          authStatus.textContent = 'Sign-in failed — see log.';
          return;
        }
        accessToken = resp.access_token;
        const expiresInMin = Math.round(resp.expires_in / 60);
        authStatus.textContent = `Signed in. Token expires in ~${expiresInMin} min.`;
        log(`Got access token. Expires in ${resp.expires_in}s (~${expiresInMin} min).`);
        chooseFileBtn.disabled = false;
      }
    });
    return tokenClient;
  }

  signinBtn.addEventListener('click', () => {
    if (!clientIdInput.value.trim()) {
      alert('Paste in your Client ID and hit "Save these" first.');
      return;
    }
    log('Requesting access token (this should prompt a Google sign-in)...');
    ensureTokenClient().requestAccessToken({ prompt: accessToken ? '' : 'consent' });
  });

  chooseFileBtn.addEventListener('click', () => {
    if (!pickerLoaded) { alert('Picker library still loading — try again in a second.'); return; }
    if (!apiKeyInput.value.trim()) { alert('Paste in your API Key and hit "Save these" first.'); return; }

    const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
      .setMimeTypes('application/vnd.google-apps.spreadsheet');

    const picker = new google.picker.PickerBuilder()
      .addView(view)
      .setOAuthToken(accessToken)
      .setDeveloperKey(apiKeyInput.value.trim())
      .setCallback((data) => {
        if (data.action === google.picker.Action.PICKED) {
          const file = data.docs[0];
          selectedSheetId = file.id;
          pickedFileEl.style.display = '';
          pickedFileEl.textContent = `Selected: ${file.name}`;
          log(`Picked file: ${file.name} (${file.id})`);
          readBtn.disabled = false;
          writeBtn.disabled = false;
        } else if (data.action === google.picker.Action.CANCEL) {
          log('Picker closed without selecting a file.');
        }
      })
      .build();
    picker.setVisible(true);
  });

  async function sheetsFetch(method, extraPath, body) {
    if (!selectedSheetId) { alert('Choose a file first.'); return null; }
    if (!accessToken) { alert('Sign in first.'); return null; }

    const url = `https://sheets.googleapis.com/v4/spreadsheets/${selectedSheetId}/values/${extraPath}`;
    const res = await fetch(url, {
      method,
      headers: {
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json'
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      log(`ERROR (${res.status}): ` + JSON.stringify(data, null, 2));
      if (res.status === 401) {
        log('Token likely expired — try Sign in again to get a fresh one.');
      }
      if (res.status === 403) {
        log('Permission denied — this can happen if drive.file access to this specific file was not properly granted. Try choosing the file again.');
      }
      return null;
    }
    return data;
  }

  readBtn.addEventListener('click', async () => {
    log('Reading A1...');
    const data = await sheetsFetch('GET', 'A1');
    if (data) log('Read result: ' + JSON.stringify(data));
  });

  writeBtn.addEventListener('click', async () => {
    const val = writeValueInput.value;
    log(`Writing "${val}" to A1...`);
    const data = await sheetsFetch(
      'PUT',
      'A1?valueInputOption=RAW',
      { values: [[val]] }
    );
    if (data) log('Write result: ' + JSON.stringify(data));
  });
</script>

</body>
</html>
